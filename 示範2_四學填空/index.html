:1px solid #bdab86;border-radius:14px;padding:25px;box-shadow:0 12px 32px #3d33141c}.lessonhead{border-bottom:1px solid #d6c6a5;padding-bottom:14px;margin-bottom:16px}.tag{font-size:12px;letter-spacing:2px;color:#84602c}.lesson h2{font-family:serif;font-size:26px;margin:8px 0}.lessonhead p{line-height:1.7;margin:6px 0;font-size:14px}.steps{display:grid;gap:10px}.step{display:flex;gap:14px;align-items:center;border:1px solid #d8ccb4;background:#fffdf7;border-radius:10px;padding:13px;position:relative;min-height:96px}.step p{margin:0;line-height:1.75;font-size:15px;flex:1}.stepnum{font-size:11px;color:#9a8056;display:block;letter-spacing:2px;margin-bottom:3px}.slot{width:122px;min-width:122px;min-height:65px;border:1px dashed #bda97e;color:#8e7952;background:linear-gradient(45deg,transparent 49.5%,#b6a27b40 50%,transparent 50.5%),linear-gradient(-45deg,transparent 49.5%,#b6a27b40 50%,transparent 50.5%),linear-gradient(transparent 49%,#b6a27b40 50%,transparent 51%),linear-gradient(90deg,transparent 49%,#b6a27b40 50%,transparent 51%);border-radius:4px;font-size:14px}.slot.over{background-color:#f5e4ad;outline:3px solid #b58942}.slot.locked{border:1px solid #77a09a;background:#edf4e9;color:#28544e;font-weight:bold}.stamp{position:absolute;width:53px;height:53px;right:2px;top:-5px;transform:rotate(12deg);pointer-events:none;animation:seal .3s ease-out}.step.done{padding-right:40px;border-color:#8daa93}.step.distractor{background:#f1ece2}.step.distractor .slot{font-size:12px;border-style:solid;background:none}.feedback{margin:14px 0;min-height:28px;font-weight:bold;line-height:1.7;font-size:14px}.feedback.error{color:#a13528}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{border:1px solid #245852;border-radius:7px;padding:11px 20px;font-weight:bold}.primary{color:#fff8e5;background:#235852}.secondary{background:#fffbef;color:#315b53}.explain{margin-top:16px;padding:20px;border:1px solid #bda575;border-radius:8px;background:#f7edd7 url('assets/images/scroll.png') center/100% 100% no-repeat}.explain-inner{background:#fff9e6eb;padding:15px;border-radius:6px}.explain p{font-size:14px;line-height:1.9}.explain h3{margin:0 0 10px}.results{text-align:center;padding:38px 10px}.score{font: bold 65px Georgia,serif;color:#a64032;margin:16px}.review{text-align:left;max-width:600px;margin:25px auto;line-height:1.9}.ghost{position:fixed;z-index:1000;pointer-events:none;width:180px;opacity:.94;transform:rotate(-4deg);box-shadow:0 6px 20px #0004}footer{text-align:center;font-size:12px;line-height:1.8;margin:22px auto;color:#4f635c}footer a{color:inherit} [hidden]{display:none!important}@keyframes seal{from{transform:scale(1.7) rotate(12deg);opacity:0}to{transform:scale(1) rotate(12deg);opacity:1}}@media(max-width:720px){header{padding-top:12px}main{padding:6px 12px 24px}.layout{grid-template-columns:1fr;gap:12px;margin-top:12px}aside{z-index:5;top:0;padding:10px 12px;box-shadow:0 4px 10px #0001}aside h2{font-size:15px;margin:0 0 7px}aside p{display:none}.bank{grid-template-columns:repeat(4,1fr);gap:5px}.card{font-size:14px;padding:10px 2px;min-height:57px}.counter{font-size:10px}.lesson{padding:15px}.step{gap:9px;padding:10px}.slot{width:91px;min-width:91px;min-height:72px;font-size:13px}.step p{font-size:14px}.topbar{padding:10px;font-size:13px;gap:8px}.meter{max-width:90px}.explain{padding:10px}.step.done{padding-right:23px}.stamp{width:38px;height:38px}.lesson h2{font-size:23px}}
</style><style>.music-panel{display:inline-flex;align-items:center;gap:9px;padding:6px 9px;border:1px solid #6d9998;border-radius:10px;background:#102f3b;color:#ecf8ef;font:13px 'Microsoft JhengHei',sans-serif}.music-panel button{font:inherit;border:0;border-radius:6px;background:#24505d;color:#fff1c8;padding:7px 10px;min-width:90px;cursor:pointer}.music-panel input{width:72px;accent-color:#e4c482;cursor:pointer}.music-panel label{display:flex;align-items:center;gap:6px}.music-panel button:focus-visible,.music-panel input:focus-visible{outline:3px solid #ffd078;outline-offset:2px}.info{flex-wrap:wrap;justify-content:flex-end;white-space:normal}@media(max-width:700px){.music-panel{font-size:12px}.music-panel input{width:62px}}</style></head><body><nav aria-label="冒險地圖導覽" style="position:relative;z-index:10;padding:12px 18px;background:#102d39;display:flex;align-items:center;gap:15px;flex-wrap:wrap"><a id="adventureMapReturn" href="../大冒險地圖/index.html" style="display:inline-block;padding:9px 16px;border:1px solid #a7d8ca;border-radius:8px;background:#174956;color:#fff4cf;text-decoration:none;font:700 15px 'Microsoft JhengHei',sans-serif">← 回到大地圖</a><span id="adventureAward" role="status" style="color:#c1f2d4;font:14px 'Microsoft JhengHei',sans-serif"></span><div class="music-panel" role="group" aria-label="背景音樂控制"><button type="button" id="musicToggle" aria-pressed="false">播放音樂</button><label for="musicVolume">音量 <input id="musicVolume" type="range" min="0" max="100" step="1" value="22" aria-label="背景音樂音量"></label></div></nav><header><div class="eyebrow">師資生的教學設計練習室</div><h1>尋找教案的四學</h1><p>讀懂學習行為，讓每一張四學字卡找到位置。</p></header><main><div class="topbar"><strong id="progress"></strong><div class="meter"><i id="bar"></i></div><span id="score"></span><button class="secondary" id="restart">重新開始</button></div><div id="play" class="layout"><aside><h2>四學字卡</h2><p>拖曳字卡到符合的步驟。也可先點字卡，再點空格；鍵盤可用 Tab、Enter。每張卡每題使用一次。</p><div class="bank" id="bank"></div><div class="note">每題 4 個四學步驟＋2 個干擾步驟。<br>干擾步驟請留白，不必填滿所有格子。</div></aside><section class="lesson"><div class="lessonhead" id="lessonhead"></div><div class="steps" id="steps"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="explain" class="explain" hidden></div><div class="actions"><button class="primary" id="next" hidden>下一題</button></div></section></div><section id="results" class="lesson results" hidden></section><footer>題庫為原創教案情境，供辨識四學的主要學習行為；並非完整課綱對照教案。<br>四學可依學習需要調整順序，教師導學也可穿插進行。<a href="https://www.moe.gov.tw/News_Content.aspx?n=9E7AC85F1954DDA8&s=0D5F9794EA97DBA4&sms=169B8E91BB75571F" target="_blank" rel="noopener">參考：教育部四學說明</a></footer></main>
<script>
'use strict';
const labels=['學生自學','組內共學','組間互學','教師導學'];
const principles=['個人先依目標閱讀、操作或練習，記錄自己的理解與疑問。','同組成員提出想法、相互解釋並共同修正，形成小組成果。','不同組交換成果、提問與回饋，並據此修正原先想法。','教師依學習證據提問、釐清迷思、提供鷹架並統整概念。'];
const raw=[
['數學｜四年級','分數大小的祕密','用圖像比較同分母分數，並說明理由。','每人閱讀分數圖卡，獨立比較 3/8 與 5/8，畫圖並記下不確定的地方。','四人小組輪流解釋自己的分數圖，針對不同答案討論，合作寫出比較的理由。','各組交換比較方法，向別組提出一個問題，再依收到的建議修正圖解。','教師根據各組圖解，追問「每份一樣大嗎？」釐清分母代表的等分意義，統整比較方法。','全班依座號領取學習單，確認姓名與日期。','組長將各組作品依編號收進資料夾。'],
['數學｜三年級','乘法解題小偵探','辨識等量群組，說明乘法算式的意義。','每人獨立讀「每袋 6 顆，共 4 袋」的情境，畫圖列式，標出不懂之處。','同組成員互相解釋圖與算式，檢查每袋數量與袋數，合作完成解題海報。','各組觀摩別組海報，提問圖與算式是否一致，再根據建議補上說明。','教師根據海報，追問 6 與 4 在情境中各代表什麼，統整等量群組與乘法的關係。','教師發給各組相同數量的彩色筆。','學生依座號將椅子排整齊。'],
['數學｜四年級','面積與周長的迷思','比較長方形的面積與周長，說明兩者的差異。','每人用方格紙畫出兩個不同長方形，獨立計算面積與周長，記下發現及疑問。','同組成員比對各自的圖與算法，檢查單位，合作整理面積與周長的比較表。','各組交換比較表，向別組提出「周長相同，面積一定相同嗎？」的質疑，再依回饋補上例子。','教師依各組例子，追問圍邊長度與覆蓋大小各指什麼，釐清周長與面積的概念。','器材長清點直尺與方格紙的數量。','各組將用過的紙張放入回收箱。'],
['數學｜五年級','異分母分數加法','用等值分數說明異分母分數相加的方法。','每人閱讀分數條，獨立嘗試計算 1/2＋1/3，畫圖並寫下卡住的地方。','同組成員輪流說明圖解，討論如何讓每一小份一樣大，合作寫出計算方法。','各組交換圖解與算式，檢查別組的等分方式，提出問題後修正本組說明。','教師依各組作答，追問分母為何不能直接相加，連結等值分數與通分並統整方法。','教師調整投影畫面亮度，讓分數條更清楚。','學生依組別將空白學習單放在桌上。'],
['數學｜五年級','平均數有什麼意思','透過移多補少理解平均數，並解釋計算結果。','每人閱讀四天的借書量紀錄，獨立用圖表示移多補少，寫下平均數的意義與疑問。','同組成員比較各自的移補方式，互相檢查總量是否不變，合作寫出平均數的解釋。','各組交換解釋，詢問別組「平均每天一定就是當天實際借出的本數嗎？」並依回饋修正說明。','教師依各組回應，連結等量分配與總量除以份數，釐清平均數和每日實際數量的差異。','教師宣布下次上課要攜帶直尺。','組長將計算紙依組別裝訂成冊。'],
['數學｜六年級','縮圖的比例尺任務','運用比例尺連結圖上距離與實際距離。','每人閱讀比例尺為 1：1000 的校園圖，獨立換算圖上 3 公分的實際距離，記錄單位與疑問。','同組成員比較換算過程，互相說明比例尺的意義，共同完成一張路線距離表。','各組交換距離表，檢查別組的換算與單位，提出疑問後修正本組結果。','教師根據各組錯誤，追問圖上與實際距離的單位是否一致，統整比例尺與單位換算的關係。','器材長將直尺整齊放入工具盒。','教師點名並確認各組人數。'],
['數學｜三年級','除法與餘數的判斷','依情境解釋商與餘數，決定合適的答案。','每人獨立思考「23 人搭車，每車最多坐 4 人」需要幾車，畫圖列式並記下疑問。','同組成員輪流解釋商與餘數的意思，討論剩下的人如何安排，合作寫出完整回答。','各組交換解法，向別組提問「只安排 5 車夠嗎？」再依回饋補上情境說明。','教師根據各組回答，連結餘數與剩餘人數，釐清除法算式的商和情境答案可能不同。','教師把情境圖卡依座號發給學生。','值日生把未使用的磁鐵收回盒內。'],
['數學｜六年級','圓面積的拼圖線索','透過切割重組理解圓面積公式的由來。','每人閱讀圓形切割重組圖，獨立標記重組後圖形的底與高，寫下猜想和疑問。','同組成員比較標記，討論底與圓周長、高與半徑的關係，共同完成推導圖。','各組交換推導圖，檢視別組的標記與理由，提問後修正本組對底和高的說明。','教師依各組圖解，釐清重組後的底約為圓周長的一半、高約為半徑，連結長方形面積以說明圓面積公式。','教師提醒使用剪刀後放回工具籃。','各組將剩餘色紙依顏色分類收好。']
];
const bankData=raw.map((r,id)=>({id,subject:r[0],title:r[1],goal:r[2],steps:r.slice(3).map((text,i)=>({text,kind:i<4?i:null,id:i}))}));
const $=s=>document.querySelector(s);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let questions,index,points,errors,history,solved,selected=null,current,drag=null,suppressClickUntil=0;
function start(){questions=shuffle(bankData).slice(0,5);index=0;points=0;errors=0;history=[];$('#results').hidden=true;$('#play').hidden=false;render()}
function render(){solved=new Set;selected=null;current=questions[index];$('#progress').textContent=`教案 ${index+1} / 5`;$('#score').textContent=`得分 ${points} / 100`;$('#bar').style.width=`${index/5*100}%`;$('#lessonhead').innerHTML=`<div class="tag">${current.subject}・教案辨識</div><h2>${current.title}</h2><p>學習目標：${current.goal}</p><p>步驟已打散：請辨識主要學習行為，不是排列教學順序。</p>`;$('#bank').innerHTML=labels.map((x,i)=>`<button class="card" data-kind="${i}" aria-pressed="false">${x}<span class="counter">待配對</span></button>`).join('');$('#steps').innerHTML=shuffle(current.steps).map((s,i)=>`<div class="step" data-step="${s.id}"><p><span class="stepnum">步驟 ${String(i+1).padStart(2,'0')}</span>${s.text}</p><button class="slot" data-step="${s.id}" aria-label="步驟 ${i+1}：${s.text}，填入四學">填入四學</button></div>`).join('');$('#feedback').textContent='先找出「誰在學、跟誰學、如何修正想法」。';$('#feedback').className='feedback';$('#explain').hidden=true;$('#next').hidden=true}
function select(k){if(solved.has(k))return;selected=k;document.querySelectorAll('.card').forEach(c=>{let on=+c.dataset.kind===k;c.classList.toggle('selected',on);c.setAttribute('aria-pressed',on)});$('#feedback').textContent=`已選「${labels[k]}」，請點選符合的步驟。`;$('#feedback').className='feedback'}
function place(k,id){if(solved.has(k))return;let s=current.steps.find(s=>s.id===id);let row=document.querySelector(`.step[data-step="${id}"]`);if(row.classList.contains('done'))return;if(s.kind!==k){errors++;$('#feedback').className='feedback error';$('#feedback').textContent=s.kind===null?'這是課務安排或器材管理，沒有呈現本題四學的主要學習行為。字卡已退回，請再試一次。':`再想一想：「${labels[k]}」重點是${principles[k]}字卡已退回。`;row.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:250});return}solved.add(k);points+=5;row.classList.add('done');let slot=row.querySelector('.slot');slot.textContent=labels[k];slot.classList.add('locked');slot.disabled=true;row.insertAdjacentHTML('beforeend','<img class="stamp" src="assets/images/good.png" alt="good 答對章">');let card=document.querySelector(`.card[data-kind="${k}"]`);card.disabled=true;card.classList.remove('selected');card.querySelector('.counter').textContent='已鎖定';selected=null;$('#score').textContent=`得分 ${points} / 100`;$('#feedback').className='feedback';$('#feedback').textContent=`答對！${labels[k]}：${principles[k]}`;if(solved.size===4)finishQuestion()}
function finishQuestion(){history.push({title:current.title,errors});document.querySelectorAll('.step:not(.done)').forEach(row=>{row.classList.add('distractor');let b=row.querySelector('button');b.textContent='干擾步驟';b.disabled=true});$('#feedback').textContent='四學全部找到！閱讀解析後再前往下一題。';$('#explain').innerHTML=`<div class="explain-inner"><h3>完整四學 × 教學解釋</h3>${labels.map((x,k)=>`<p><strong>${k+1}. ${x}</strong>｜${principles[k]}<br>本教案：${current.steps[k].text}</p>`).join('')}<p><strong>干擾說明：</strong>${current.steps.slice(4).map(s=>s.text).join('／')}這些步驟有課務用途，但文字本身未呈現四學的學習歷程。</p><p><strong>教學提醒：</strong>四學不是固定時間表，也不是只看有沒有分組或使用平板；應觀察學習者如何理解、協作、回饋與修正。此處依步驟的主要行為判斷。</p></div>`;$('#explain').hidden=false;$('#next').hidden=false;$('#next').textContent=index===4?'查看本輪成績':'下一題';$('#bar').style.width=`${(index+1)/5*100}%`}
$('#next').onclick=()=>{if(solved.size!==4)return;index++;if(index<5){render();window.scrollTo({top:0,behavior:'smooth'})}else{ $('#play').hidden=true;$('#results').hidden=false;let tries=20+errors;$('#results').innerHTML=`<div class="tag">五份教案・辨識完成</div><h2>四學，已在你的教案裡就位</h2><div class="score">${points}<small style="font-size:22px"> / 100</small></div><p>完成配對 20 / 20｜誤放 ${errors} 次｜配對正確率 ${Math.round(20/tries*100)}%</p><p>每個配對 5 分，答錯可重試且不扣分；正確率反映本輪練習歷程。</p><div class="review">${history.map((h,i)=>`<div>${i+1}. ${h.title}：誤放 ${h.errors-(i?history[i-1].errors:0)} 次</div>`).join('')}</div><button class="primary" id="again">重新抽 5 題</button>`;$('#again').onclick=start;window.scrollTo({top:0,behavior:'smooth'})}};
$('#restart').onclick=start;
$('#bank').addEventListener('click',e=>{if(Date.now()<suppressClickUntil)return;let c=e.target.closest('.card');if(c&&!c.disabled)select(+c.dataset.kind)});
$('#steps').addEventListener('click',e=>{let s=e.target.closest('.slot');if(!s||s.disabled)return;if(selected===null){$('#feedback').textContent='請先選一張四學字卡，再點這個空格。';return}place(selected,+s.dataset.step)});
$('#bank').addEventListener('pointerdown',e=>{let c=e.target.closest('.card');if(!c||c.disabled||e.button!==0)return;drag={kind:+c.dataset.kind,x:e.clientX,y:e.clientY,id:e.pointerId,source:c,ghost:null};c.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.ghost=drag.source.cloneNode(true);drag.ghost.classList.add('ghost');drag.ghost.removeAttribute('data-kind');drag.ghost.disabled=false;document.body.append(drag.ghost)}if(!drag.ghost)return;e.preventDefault();drag.ghost.style.left=`${e.clientX-90}px`;drag.ghost.style.top=`${e.clientY-35}px`;document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'));let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');if(target&&!target.disabled)target.classList.add('over');if(e.clientY>innerHeight-65)window.scrollBy(0,12);if(e.clientY<75)window.scrollBy(0,-12)},{passive:false});
document.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;let d=drag;drag=null;if(d.ghost){suppressClickUntil=Date.now()+400;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');d.ghost.remove();document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'));if(target&&!target.disabled)place(d.kind,+target.dataset.step);else{$('#feedback').textContent='字卡已退回。請放到教學步驟的米字格中。'}e.preventDefault();} });
document.addEventListener('pointercancel',()=>{drag?.ghost?.remove();drag=null;document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'))});
start();
</script>
<!-- 大冒險地圖銜接：保留原遊戲程式，通關後另存憑證。 -->
<script>
(()=>{const key='cert_idiom',name='四學之印',link=document.getElementById('adventureMapReturn');const run=new URLSearchParams(location.search).get('run');let earned=false;try{earned=!!run&&localStorage.getItem(key+'_run')===run&&localStorage.getItem(key)==='true'}catch(e){}function updateLink(){const p=new URLSearchParams();if(run)p.set('run',run);if(earned)p.set(key,'1');link.href='../大冒險地圖/index.html'+(p.size?'?'+p:'');if(earned)document.getElementById('adventureAward').textContent='已取得'+name+' ✓，返回地圖即可查看。'}function award(){earned=true;try{localStorage.setItem(key,'true');if(run)localStorage.setItem(key+'_run',run)}catch(e){}updateLink()}updateLink();const next=document.querySelector('#next'),originalNext=next.onclick;next.onclick=function(...args){originalNext.apply(this,args);if(!document.querySelector('#results').hidden&&points===100)award()};})();
</script>
<audio id="adventureMusic" src="../大冒險地圖/audio/stellar-journey.wav" loop preload="auto" aria-label="星印航行，原創科技冒險配樂"></audio>
<script>
(()=>{'use strict';const audio=document.getElementById('adventureMusic'),toggle=document.getElementById('musicToggle'),slider=document.getElementById('musicVolume');const query=new URLSearchParams(location.search),storeKey='stellar_music_preferences';let pref={enabled:true,volume:.22,time:0};try{Object.assign(pref,JSON.parse(sessionStorage.getItem(storeKey)||'{}'))}catch(e){}if(query.has('bgmMuted'))pref.enabled=query.get('bgmMuted')!=='1';if(query.has('bgmVolume'))pref.volume=Number(query.get('bgmVolume'));if(query.has('bgmTime'))pref.time=Number(query.get('bgmTime'));pref.volume=Number.isFinite(pref.volume)?Math.max(0,Math.min(1,pref.volume)):.22;pref.time=Number.isFinite(pref.time)?Math.max(0,pref.time):0;audio.volume=pref.volume;slider.value=Math.round(pref.volume*100);let requesting=false;
function save(){if(window.adventureMusicReset)return;try{sessionStorage.setItem(storeKey,JSON.stringify({enabled:pref.enabled,volume:audio.volume,time:audio.currentTime||pref.time}))}catch(e){}}
function update(){toggle.textContent=!pref.enabled?'音樂：關閉':audio.paused?'播放音樂':'音樂：開啟';toggle.setAttribute('aria-pressed',String(pref.enabled&&!audio.paused));slider.setAttribute('aria-valuetext',Math.round(audio.volume*100)+'%')}
async function play(){if(!pref.enabled||document.hidden||requesting)return;requesting=true;try{await audio.play()}catch(e){/* 瀏覽器需使用者點擊後才能播放，保留播放按鈕供操作。 */}finally{requesting=false;update()}}
toggle.addEventListener('click',()=>{if(pref.enabled&&!audio.paused){pref.enabled=false;audio.pause()}else{pref.enabled=true;play()}save();update()});slider.addEventListener('input',()=>{audio.volume=Number(slider.value)/100;save();update();if(pref.enabled&&audio.volume>0)play()});
audio.addEventListener('loadedmetadata',()=>{if(audio.duration>0)audio.currentTime=pref.time%audio.duration;if(!document.getElementById('cover')||document.body.classList.contains('cover-seen'))play()});audio.addEventListener('play',update);audio.addEventListener('pause',update);audio.addEventListener('error',()=>{toggle.textContent='音樂載入失敗';toggle.title='請確認 audio/stellar-journey.wav 與遊戲資料夾一起保留。'});
window.adventureMusicLink=function(href){const u=new URL(href,location.href);u.searchParams.set('bgmMuted',pref.enabled?'0':'1');u.searchParams.set('bgmVolume',audio.volume.toFixed(2));u.searchParams.set('bgmTime',(audio.currentTime||pref.time).toFixed(2));save();return u.href};
document.addEventListener('click',e=>{const back=e.target.closest('#adventureMapReturn');if(back)back.href=window.adventureMusicLink(back.href);if(!e.target.closest('.music-panel'))play()},true);
// 大地圖會先移除憑證查詢字串，原始音樂參數由頁首暫存讀回。
window.addEventListener('pagehide',()=>{if(!window.adventureMusicReset)save();audio.pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){save();audio.pause()}else if(!document.getElementById('cover')||document.body.classList.contains('cover-seen'))play()});update();
})();
</script></body></html>
