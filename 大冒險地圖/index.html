<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星印紀元：南大之門｜大冒險地圖</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071e29;color:#e9f6ed;font-family:"Microsoft JhengHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,[role=button]:focus-visible{outline:3px solid #ffd078;outline-offset:4px}header{max-width:1440px;margin:auto;padding:24px 30px 15px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0 0 8px;font-size:32px;letter-spacing:.12em}header p{margin:0;color:#b9d7d5;font-size:15px}.info{display:flex;gap:18px;align-items:center;white-space:nowrap}.control{border:1px solid #72b9b4;background:#153d49;color:#eaf8ee;padding:10px 16px;border-radius:10px}.stage{display:grid;place-items:center;padding:0 20px}.map{position:relative;width:min(1400px,100%,calc((100dvh - 195px)*16/9));margin:auto}.map img{display:block;width:100%;max-width:100%;max-height:calc(100dvh - 195px);object-fit:contain;border-radius:18px;box-shadow:0 15px 60px #0006}.hotspot{position:absolute;border:0;border-radius:12px;background:transparent;cursor:pointer;transition:box-shadow .2s,background .2s}.hotspot:hover{background:#a2fff01c;box-shadow:0 0 20px #8affde88,inset 0 0 15px #8affde55}.hotspot.done{box-shadow:0 0 12px #64ffab55}.check{position:absolute;right:-14px;top:-25px;width:34px;height:34px;display:grid;place-items:center;background:#087a48;border:2px solid #c6ffdf;border-radius:50%;color:white;font-weight:900;font-size:24px;box-shadow:0 3px 10px #0006}.legend{margin:18px auto;text-align:center;color:#bbd7d4;font-size:14px;padding:0 20px}dialog{border:1px solid #73bab1;border-radius:22px;background:#102f3b;color:#ecf8ef;max-width:760px;width:calc(100% - 28px);padding:28px;box-shadow:0 25px 100px #0009}dialog::backdrop{background:#00121ddb;backdrop-filter:blur(8px)}.dialogtop{display:flex;justify-content:space-between;align-items:center;gap:16px}h2{margin:0;font-size:28px}.close{padding:8px 14px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.slot{min-height:135px;border:2px dashed #64918c;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#061f2b;color:#d5eae1}.slot.good{border:2px solid #75dfa2;background:#12553d}.slot.over{outline:3px solid #ffd078}.slot.bad{animation:wrong .4s}.badge{padding:15px 14px;border:2px solid #dcb96e;border-radius:14px;color:#ffe4a3;background:#204c57;font-weight:bold;box-shadow:0 5px 10px #0003;touch-action:none;user-select:none}.badge.selected{outline:3px solid #ffe194}.bag{min-height:100px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;border-radius:14px;background:#071f2a;padding:20px}.ghost{position:fixed;pointer-events:none;z-index:1000;transform:translate(-50%,-50%);opacity:.9}#message{min-height:42px;line-height:1.6;color:#ffe5aa}#victory{text-align:center;padding:65px 20px}#victory h2{font-size:42px;color:#ffe3a0}#victory p{font-size:22px;margin:30px}#victory button{padding:14px 32px}[hidden]{display:none!important}@keyframes wrong{0%,100%{background:#061f2b}30%,70%{background:#ab343f;transform:translateX(-4px)}50%{transform:translateX(4px)}}@media(max-width:700px){header{padding:18px;align-items:flex-start;flex-direction:column;gap:12px}h1{font-size:26px}header p{font-size:13px}.info{align-self:flex-end;font-size:14px}.map{width:100%}.map img{max-height:none}.stage{padding:0 8px}.slots{gap:7px}.slot{min-height:120px}.badge{padding:13px 7px;font-size:14px}dialog{padding:20px 14px}h2{font-size:23px}.check{width:25px;height:25px;font-size:18px;top:-18px;right:-8px}}

/* 封面以繪圖模型產生的 PNG 顯示；置中完整呈現，點擊整個畫面開始。 */
#cover{position:fixed;inset:0;z-index:2000;width:100%;height:100dvh;display:grid;place-items:center;padding:0;border:0;border-radius:0;background:#061823;cursor:pointer;opacity:1;transition:opacity .65s ease;touch-action:manipulation}
#cover img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
#cover:focus-visible{outline:3px solid #ffd078;outline-offset:-6px}
body:not(.cover-seen){overflow:hidden}
body:not(.cover-seen) #adventureApp{visibility:hidden}
body.cover-seen #cover:not(.exiting){display:none}
#cover.exiting{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){#cover{transition:none}}
</style><style>.music-panel{display:inline-flex;align-items:center;gap:9px;padding:6px 9px;border:1px solid #6d9998;border-radius:10px;background:#102f3b;color:#ecf8ef;font:13px 'Microsoft JhengHei',sans-serif}.music-panel button{font:inherit;border:0;border-radius:6px;background:#24505d;color:#fff1c8;padding:7px 10px;min-width:90px;cursor:pointer}.music-panel input{width:72px;accent-color:#e4c482;cursor:pointer}.music-panel label{display:flex;align-items:center;gap:6px}.music-panel button:focus-visible,.music-panel input:focus-visible{outline:3px solid #ffd078;outline-offset:2px}.info{flex-wrap:wrap;justify-content:flex-end;white-space:normal}@media(max-width:700px){.music-panel{font-size:12px}.music-panel input{width:62px}}</style></head><body>
<script>try{if(sessionStorage.getItem('adventure_cover_seen')==='true')document.body.classList.add('cover-seen')}catch(e){}</script>
<button id="cover" type="button" aria-label="星印紀元：南大之門。點擊任何部位遊戲開始，或按 Enter、空白鍵。"><img src="cover.png" alt="星印紀元：南大之門，點擊任何部位遊戲開始" fetchpriority="high" draggable="false"></button>
<div id="adventureApp">
<header><div><h1>大冒險地圖</h1><p>完成 3 個關卡，拿到 3 個憑證解開大門</p></div><div class="info"><strong id="count">持有 0 / 3</strong><button class="control" id="reset">🔄 清除進度</button><div class="music-panel" role="group" aria-label="背景音樂控制"><button type="button" id="musicToggle" aria-pressed="false">播放音樂</button><label for="musicVolume">音量 <input id="musicVolume" type="range" min="0" max="100" step="1" value="22" aria-label="背景音樂音量"></label></div></div></header>
<main id="mapScreen"><div class="stage"><div class="map"><img src="map-bg.png" alt="科技校園冒險地圖：語詞光譜館、四學創研所、勇者試煉場與中央終極之門" width="1920" height="1080" id="mapImage">
<div class="hotspot" id="level0" role="button" tabindex="0" style="left:9%;top:25%;width:23%;height:8%" aria-label="能指配對，未完成"></div>
<div class="hotspot" id="level1" role="button" tabindex="0" style="left:64%;top:24.5%;width:24%;height:8%" aria-label="四學填空，未完成"></div>
<div class="hotspot" id="level2" role="button" tabindex="0" style="left:68%;top:76%;width:25%;height:8.5%" aria-label="打怪 RPG，未完成"></div>
<div class="hotspot" id="gate" role="button" tabindex="0" style="left:39%;top:51%;width:22%;height:8%" aria-label="通關大門，隨時可以開啟"></div>
</div></div><p class="legend">點選地圖上的名牌開始挑戰。中央大門隨時開放試放憑證，集齊三印即可解鎖。</p></main>
<section id="victory" hidden><h2>🏆 冒險完成！</h2><p>三印齊聚，知識之門已為你開啟。</p><p>總冒險時長：<strong id="duration"></strong></p><button class="control" id="again">再次冒險</button></section>
<dialog id="door" aria-labelledby="doorTitle"><div class="dialogtop"><h2 id="doorTitle">通關大門</h2><button class="control close" id="close">關閉</button></div><p>將憑證拖入對應凹槽，也可先點憑證，再點凹槽。</p><div class="slots"><button class="slot" data-slot="0"><strong>語詞</strong><span>放入能指之印</span></button><button class="slot" data-slot="1"><strong>造句</strong><span>放入四學之印</span></button><button class="slot" data-slot="2"><strong>勇者</strong><span>放入勇者之印</span></button></div><h3>冒險背包</h3><div class="bag" id="bag"></div><p id="message" role="status" aria-live="polite"></p></dialog>
</div>
<script>
'use strict';
const KEYS=['cert_dynasty','cert_idiom','cert_warrior'],NAMES=['能指之印','四學之印','勇者之印'],GAMES=['能指配對','四學填空','打怪 RPG'],PATHS=['../示範1_能指配對/index.html','../示範2_四學填空/index.html','../示範3_打怪RPG/index.html'];
const $=s=>document.querySelector(s);
const cover=$('#cover'),app=$('#adventureApp');let coverStarted=document.body.classList.contains('cover-seen');app.inert=!coverStarted;
if(coverStarted)cover.hidden=true;else cover.focus({preventScroll:true});
function enterAdventure(){if(coverStarted)return;coverStarted=true;try{sessionStorage.setItem('adventure_cover_seen','true')}catch(e){}cover.classList.add('exiting');document.body.classList.add('cover-seen');app.inert=false;const finishCover=()=>{cover.hidden=true;cover.classList.remove('exiting');$('#level0').focus({preventScroll:true})};if(matchMedia('(prefers-reduced-motion: reduce)').matches)finishCover();else setTimeout(finishCover,700)}
cover.addEventListener('click',enterAdventure);
let storageOK=true;const memory={};function read(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return memory[k]??null}}function write(k,v){memory[k]=String(v);try{localStorage.setItem(k,String(v))}catch(e){storageOK=false}}
let start=Number(read('adventure_start'));if(!Number.isFinite(start)||start<=0||start>Date.now()){start=Date.now();write('adventure_start',start)}
window.adventureMusicParams=location.search;const params=new URLSearchParams(location.search);if(params.get('run')===String(start))KEYS.forEach(k=>{if(params.get(k)==='1')write(k,'true')});if(location.search)history.replaceState(null,'',location.pathname);
let held=[],placed=new Set(),selected=null,drag=null,suppress=0;
function refresh(){held=KEYS.map(k=>{const v=read(k);return v!==null&&!['','0','false','null','undefined'].includes(v)});$('#count').textContent=`持有 ${held.filter(Boolean).length} / 3`;held.forEach((yes,i)=>{const el=$('#level'+i);el.classList.toggle('done',yes);el.setAttribute('aria-label',`${GAMES[i]}，${yes?'已完成 ✓':'未完成'}`);el.title=el.getAttribute('aria-label');el.querySelector('.check')?.remove();if(yes)el.insertAdjacentHTML('beforeend','<span class="check" aria-hidden="true">✓</span>')})}
function activate(el,fn){el.onclick=fn;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}}PATHS.forEach((p,i)=>activate($('#level'+i),()=>location.href=window.adventureMusicLink(p+'?run='+start)));
function drawBag(){const bag=$('#bag');bag.replaceChildren();held.forEach((yes,i)=>{if(!yes||placed.has(i))return;const b=document.createElement('button');b.className='badge';b.textContent=NAMES[i];b.dataset.cert=i;b.draggable=true;b.setAttribute('aria-pressed',String(selected===i));b.classList.toggle('selected',selected===i);bag.append(b)});if(!bag.childElementCount)bag.textContent=placed.size?'已持有的憑證都已放入凹槽。':'背包還沒有憑證，先去挑戰關卡吧！'}
function openDoor(){refresh();placed=new Set();selected=null;document.querySelectorAll('.slot').forEach((el,i)=>{el.className='slot';el.innerHTML=`<strong>${['語詞','造句','勇者'][i]}</strong><span>放入${NAMES[i]}</span>`});drawBag();$('#message').textContent=storageOK?'可以先試放目前持有的憑證；三印全部對位才會開門。':'瀏覽器停用了儲存功能，請允許本機儲存後重新開啟。';$('#door').showModal()}
activate($('#gate'),openDoor);$('#close').onclick=()=>$('#door').close();
function place(i,j){if(!Number.isInteger(i)||!held[i]||placed.has(i)||placed.has(j))return;const slot=$(`[data-slot="${j}"]`);selected=null;if(i!==j){slot.classList.remove('bad');void slot.offsetWidth;slot.classList.add('bad');$('#message').textContent='凹槽不相符，憑證已退回背包。';drawBag();return}placed.add(i);slot.className='slot good';slot.innerHTML=`<strong>${['語詞','造句','勇者'][j]}</strong><span>${NAMES[i]} ✓</span>`;drawBag();$('#message').textContent=`成功放入${NAMES[i]}！已對位 ${placed.size} / 3。`;if(placed.size===3){$('#door').close();$('#mapScreen').hidden=true;$('#victory').hidden=false;const seconds=Math.max(0,Math.floor((Date.now()-start)/1000));$('#duration').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')} 分 ${String(seconds%60).padStart(2,'0')} 秒`;$('#again').focus()}}
$('#bag').addEventListener('click',e=>{if(Date.now()<suppress)return;const b=e.target.closest('[data-cert]');if(b){selected=Number(b.dataset.cert);drawBag();$('#message').textContent=`已選${NAMES[selected]}，請點對應凹槽。`}});
document.querySelectorAll('.slot').forEach(slot=>{slot.onclick=()=>{if(selected!==null)place(selected,Number(slot.dataset.slot))};slot.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';slot.classList.add('over')};slot.ondragleave=()=>slot.classList.remove('over');slot.ondrop=e=>{e.preventDefault();slot.classList.remove('over');const raw=e.dataTransfer.getData('text/plain');if(raw!=='')place(Number(raw),Number(slot.dataset.slot))}});
$('#bag').addEventListener('dragstart',e=>{const b=e.target.closest('[data-cert]');if(b){e.dataTransfer.setData('text/plain',b.dataset.cert);e.dataTransfer.effectAllowed='move'}});
$('#bag').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const b=e.target.closest('[data-cert]');if(!b)return;drag={id:e.pointerId,i:Number(b.dataset.cert),x:e.clientX,y:e.clientY,source:b,ghost:null};b.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.ghost=drag.source.cloneNode(true);drag.ghost.classList.add('ghost');drag.ghost.removeAttribute('data-cert');document.body.append(drag.ghost)}if(drag.ghost){e.preventDefault();drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';document.querySelectorAll('.slot').forEach(s=>s.classList.remove('over'));document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot')?.classList.add('over')}},{passive:false});
function cleanDrag(){drag?.ghost?.remove();drag=null;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('over'))}document.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');cleanDrag();if(d.ghost){suppress=Date.now()+500;if(target)place(d.i,Number(target.dataset.slot))}});document.addEventListener('pointercancel',cleanDrag);$('#door').addEventListener('close',cleanDrag);window.addEventListener('blur',cleanDrag);
function reset(){window.adventureMusicReset=true;document.getElementById('adventureMusic').pause();try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}Object.keys(memory).forEach(k=>delete memory[k]);location.replace(location.pathname)}$('#reset').onclick=()=>{if(confirm('清除憑證與冒險計時，重新開始？'))reset()};$('#again').onclick=reset;window.addEventListener('pageshow',refresh);window.addEventListener('storage',refresh);refresh();
</script><audio id="adventureMusic" src="audio/stellar-journey.wav" loop preload="auto" aria-label="星印航行，原創科技冒險配樂"></audio>
<script>
(()=>{'use strict';const audio=document.getElementById('adventureMusic'),toggle=document.getElementById('musicToggle'),slider=document.getElementById('musicVolume');const query=new URLSearchParams(window.adventureMusicParams||location.search),storeKey='stellar_music_preferences';let pref={enabled:true,volume:.22,time:0};try{Object.assign(pref,JSON.parse(sessionStorage.getItem(storeKey)||'{}'))}catch(e){}if(query.has('bgmMuted'))pref.enabled=query.get('bgmMuted')!=='1';if(query.has('bgmVolume'))pref.volume=Number(query.get('bgmVolume'));if(query.has('bgmTime'))pref.time=Number(query.get('bgmTime'));pref.volume=Number.isFinite(pref.volume)?Math.max(0,Math.min(1,pref.volume)):.22;pref.time=Number.isFinite(pref.time)?Math.max(0,pref.time):0;audio.volume=pref.volume;slider.value=Math.round(pref.volume*100);let requesting=false;
function save(){if(window.adventureMusicReset)return;try{sessionStorage.setItem(storeKey,JSON.stringify({enabled:pref.enabled,volume:audio.volume,time:audio.currentTime||pref.time}))}catch(e){}}
function update(){toggle.textContent=!pref.enabled?'音樂：關閉':audio.paused?'播放音樂':'音樂：開啟';toggle.setAttribute('aria-pressed',String(pref.enabled&&!audio.paused));slider.setAttribute('aria-valuetext',Math.round(audio.volume*100)+'%')}
async function play(){if(!pref.enabled||document.hidden||requesting)return;requesting=true;try{await audio.play()}catch(e){/* 瀏覽器需使用者點擊後才能播放，保留播放按鈕供操作。 */}finally{requesting=false;update()}}
toggle.addEventListener('click',()=>{if(pref.enabled&&!audio.paused){pref.enabled=false;audio.pause()}else{pref.enabled=true;play()}save();update()});slider.addEventListener('input',()=>{audio.volume=Number(slider.value)/100;save();update();if(pref.enabled&&audio.volume>0)play()});
audio.addEventListener('loadedmetadata',()=>{if(audio.duration>0)audio.currentTime=pref.time%audio.duration;if(!document.getElementById('cover')||document.body.classList.contains('cover-seen'))play()});audio.addEventListener('play',update);audio.addEventListener('pause',update);audio.addEventListener('error',()=>{toggle.textContent='音樂載入失敗';toggle.title='請確認 audio/stellar-journey.wav 與遊戲資料夾一起保留。'});
window.adventureMusicLink=function(href){const u=new URL(href,location.href);u.searchParams.set('bgmMuted',pref.enabled?'0':'1');u.searchParams.set('bgmVolume',audio.volume.toFixed(2));u.searchParams.set('bgmTime',(audio.currentTime||pref.time).toFixed(2));save();return u.href};
document.addEventListener('click',e=>{const back=e.target.closest('#adventureMapReturn');if(back)back.href=window.adventureMusicLink(back.href);if(!e.target.closest('.music-panel'))play()},true);
// 大地圖會先移除憑證查詢字串，原始音樂參數由頁首暫存讀回。
window.addEventListener('pagehide',()=>{if(!window.adventureMusicReset)save();audio.pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){save();audio.pause()}else if(!document.getElementById('cover')||document.body.classList.contains('cover-seen'))play()});update();
})();
</script></body></html>
